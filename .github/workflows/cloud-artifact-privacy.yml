name: Check draft artifact access boundaries
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Non-secret draft fixture release tag
        required: true
        type: string
permissions: {}
jobs:
  read-only-token:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Record whether contents read can see a draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^mrfps-privacy-probe-[a-f0-9]{16}$ ]]
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >"$RUNNER_TEMP/result.json" 2>/dev/null; then
            echo 'contents_read_draft_visible=true' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'contents_read_draft_visible=false' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  write-token:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify scoped publication token can download a private draft fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^mrfps-privacy-probe-[a-f0-9]{16}$ ]]
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern privacy-fixture.txt --dir "$RUNNER_TEMP/mrfps-privacy"
          grep -qx 'MRFPS non-secret draft-access fixture' "$RUNNER_TEMP/mrfps-privacy/privacy-fixture.txt"
          echo 'contents_write_draft_download=true' | tee -a "$GITHUB_STEP_SUMMARY"
