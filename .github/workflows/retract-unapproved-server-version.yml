name: Retract only the unapproved public server version
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first, or retract the single exact version below
        type: choice
        options: [Inspect, Retract]
        default: Inspect
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: mrfps-unapproved-ghcr-retraction
  cancel-in-progress: false
jobs:
  contain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Verify identity and retract only the exact newly published version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          OWNER = 'mizuamedesu'
          PACKAGE = 'mrfps-server'
          REPOSITORY = OWNER + '/MRFPS'
          DIGEST = 'sha256:48ae47206d23410e30cc09b3da6c0fb7653454f0ba29c933f427473d6d0ac78a'
          TAG = 'linux-d924f9885549-d661d269b7ae'
          API = 'https://api.github.com/users/' + OWNER + '/packages/container/' + PACKAGE
          REGISTRY = 'https://ghcr.io/v2/' + OWNER + '/' + PACKAGE
          ACCEPT = ', '.join(('application/vnd.docker.distribution.manifest.v2+json', 'application/vnd.oci.image.manifest.v1+json'))

          def request(url, token=None, method='GET', headers=None, one_byte=False):
              hdr = {'Accept': 'application/vnd.github+json', 'User-Agent': 'MRFPS-publication-containment'}
              if token:
                  hdr['Authorization'] = 'Bearer ' + token
              hdr.update(headers or {})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=hdr, method=method), timeout=15) as response:
                      return response.status, response.read(1 if one_byte else 2 * 1024 * 1024), {key.lower(): value for key, value in response.headers.items()}
              except urllib.error.HTTPError as error:
                  return error.code, error.read(16384), {}

          def api_json(suffix=''):
              status, data, _ = request(API + suffix, os.environ['GH_TOKEN'])
              if status != 200:
                  raise SystemExit('PACKAGE_IDENTITY_QUERY_HTTP_' + str(status))
              return json.loads(data)

          if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY:
              raise SystemExit('RETRACTION_REPOSITORY_MISMATCH')
          def verified_only_version():
              package = api_json()
              versions = api_json('/versions?per_page=100&state=active')
              if (package.get('name') != PACKAGE or package.get('package_type') != 'container'
                  or package.get('owner', {}).get('login') != OWNER
                  or package.get('repository', {}).get('full_name') != REPOSITORY
                  or package.get('visibility') != 'public'
                  or package.get('version_count') != 1 or len(versions) != 1):
                  raise SystemExit('RETRACTION_IDENTITY_OR_SINGLE_VERSION_CHECK_FAILED')
              version = versions[0]
              if version.get('name') != DIGEST or version.get('metadata', {}).get('container', {}).get('tags') != [TAG]:
                  raise SystemExit('RETRACTION_EXACT_DIGEST_OR_TAG_MISMATCH')
              version_id = version.get('id')
              if not isinstance(version_id, int) or version_id <= 0:
                  raise SystemExit('RETRACTION_VERSION_ID_INVALID')
              return package, version_id

          package, version_id = verified_only_version()

          def anonymous_token():
              status, raw, _ = request('https://ghcr.io/token?service=ghcr.io&scope=repository:' + OWNER + '/' + PACKAGE + ':pull')
              if status != 200:
                  return None, status
              payload = json.loads(raw)
              token = payload.get('token') or payload.get('access_token')
              if not isinstance(token, str) or not token:
                  raise SystemExit('ANONYMOUS_TOKEN_RESPONSE_INVALID')
              return token, status

          # Anonymous credentials remain in process memory; neither bodies nor
          # tokens are saved. Read at most one byte from the largest layer.
          old_token, token_status = anonymous_token()
          manifest_status, raw_manifest, manifest_headers = request(REGISTRY + '/manifests/' + TAG, old_token, headers={'Accept': ACCEPT})
          print(json.dumps({'phase': 'anonymous-manifest-check', 'token_status': token_status,
                            'manifest_status': manifest_status, 'digest_matches': manifest_headers.get('docker-content-digest') == DIGEST}))
          if token_status != 200 or manifest_status != 200 or manifest_headers.get('docker-content-digest') != DIGEST:
              raise SystemExit('ANONYMOUS_EXACT_MANIFEST_PRECONDITION_FAILED')
          manifest = json.loads(raw_manifest)
          layers = manifest.get('layers', [])
          if not layers:
              raise SystemExit('MANIFEST_LAYERS_MISSING')
          largest = max(layers, key=lambda layer: layer.get('size', 0))['digest']
          if not isinstance(largest, str) or len(largest) != 71 or not largest.startswith('sha256:') or any(c not in '0123456789abcdef' for c in largest[7:]):
              raise SystemExit('LAYER_DIGEST_INVALID')
          before_layer_status, _, _ = request(REGISTRY + '/blobs/' + largest, old_token, headers={'Range': 'bytes=0-0'}, one_byte=True)
          print(json.dumps({'phase': 'identity-verified', 'package': PACKAGE, 'version_id': version_id, 'digest': DIGEST,
                            'visibility': package['visibility'], 'anonymous_manifest_status': manifest_status,
                            'anonymous_largest_layer_status': before_layer_status, 'operation': os.environ['OPERATION']}))
          if os.environ['OPERATION'] == 'Inspect':
              raise SystemExit(0)
          if os.environ['OPERATION'] != 'Retract':
              raise SystemExit('RETRACTION_OPERATION_INVALID')
          status, error_body, _ = request(API + '/versions/' + str(version_id), os.environ['GH_TOKEN'], method='DELETE')
          deletion_scope = 'exact-version'
          if status == 400:
              try:
                  message = json.loads(error_body).get('message', '')
              except (ValueError, AttributeError):
                  message = ''
              # GitHub's public API diagnostic contains no request credential;
              # emit only bounded ordinary ASCII, never the raw response.
              safe_message = message if isinstance(message, str) and re.fullmatch(r'[A-Za-z0-9 .,:;()/\x27_-]{1,240}', message) else 'UNEXPECTED_API_ERROR_MESSAGE'
              print(json.dumps({'phase': 'version-delete-refused', 'status': status, 'message': safe_message}))
              reason = message.lower() if isinstance(message, str) else ''
              if 'last' not in reason or 'version' not in reason or 'package' not in reason or 'delet' not in reason:
                  raise SystemExit('PACKAGE_DELETE_FALLBACK_REASON_NOT_PROVEN')
              # Explicitly authorized containment fallback. Re-read all identity
              # constraints immediately before deleting this one-version package.
              _, current_id = verified_only_version()
              if current_id != version_id:
                  raise SystemExit('RETRACTION_VERSION_CHANGED_BEFORE_PACKAGE_DELETE')
              status, _, _ = request(API, os.environ['GH_TOKEN'], method='DELETE')
              deletion_scope = 'verified-single-version-package'
          if status != 204:
              raise SystemExit('EXACT_VERSION_DELETE_HTTP_' + str(status))
          for attempt in range(1, 7):
              fresh_token, fresh_token_status = anonymous_token()
              tag_status, _, _ = request(REGISTRY + '/manifests/' + TAG, fresh_token, headers={'Accept': ACCEPT})
              digest_status, _, _ = request(REGISTRY + '/manifests/' + DIGEST, fresh_token, headers={'Accept': ACCEPT})
              fresh_layer_status, _, _ = request(REGISTRY + '/blobs/' + largest, fresh_token, headers={'Range': 'bytes=0-0'}, one_byte=True)
              old_layer_status, _, _ = request(REGISTRY + '/blobs/' + largest, old_token, headers={'Range': 'bytes=0-0'}, one_byte=True)
              result = {'phase': 'post-retraction', 'attempt': attempt, 'delete_status': status, 'deletion_scope': deletion_scope, 'version_id': version_id,
                        'fresh_anonymous_token_status': fresh_token_status, 'tag_status': tag_status, 'digest_status': digest_status,
                        'fresh_anonymous_layer_status': fresh_layer_status, 'prior_anonymous_layer_status': old_layer_status}
              print(json.dumps(result))
              denied = {401, 403, 404, 410}
              if all(code in denied for code in (tag_status, digest_status, fresh_layer_status, old_layer_status)):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('Exact unapproved public version deleted; fresh/prior anonymous manifest and layer requests denied.\n')
                  raise SystemExit(0)
              if attempt < 6:
                  time.sleep(5)
          raise SystemExit('VERSION_DELETED_BUT_ANONYMOUS_ACCESS_NOT_FULLY_REVOKED')
          PY
